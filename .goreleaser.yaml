version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    main: .
    binary: gost-tunnel
    targets:
      # - darwin_amd64
      # - darwin_arm64
      - windows_386
      - windows_amd64
      - windows_arm64
      - linux_arm_5
      - linux_arm_6
      - linux_arm_7
      - linux_arm64
      - linux_amd64
    ldflags:
      - "-s -w -X 'main.version={{ .Tag }}'"

upx:
  - enabled: true
    # Filter by build ID.
    # ids: [build1, build2]

    # Filter by GOOS.
    goos: [linux]
    # Filter by GOARCH.
    goarch: [arm, arm64, amd64]

    # Filter by GOARM.
    # goarm: [8]

    # Filter by GOAMD64.
    # goamd64: [v1]

    # Compress argument.
    # Valid options are from '1' (faster) to '9' (better), and 'best'.
    compress: best
    # Whether to try LZMA (slower).
    lzma: true
    # Whether to try all methods and filters (slow).
    brute: true

  - enabled: true
    goos: [windows]
    goarch: [amd64, 386]
    compress: best
    lzma: true
    brute: true

archives:
  - formats: [tar.gz]
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  mode: keep-existing
