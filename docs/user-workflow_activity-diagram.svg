<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1392px" preserveAspectRatio="none" style="width:542px;height:1392px;background:#FFFFFF;" version="1.1" viewBox="0 0 542 1392" width="542px" zoomAndPan="magnify"><title>TCP Tunnel &amp; Entrypoint Workflow</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="250.7354" x="144.2671" y="33.5352">TCP Tunnel &amp; Entrypoint Workflow</text></g><ellipse cx="271.1348" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="391.7734" style="stroke:#000000;stroke-width:1.5;" width="411.8477" x="65.2109" y="77.4883"/><path d="M321.168,77.4883 L321.168,86.9766 L311.168,96.9766 L65.2109,96.9766" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.957" x="68.2109" y="92.0234">Part 1: Create TCP Tunnel on Host A</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.1992" x="183.0352" y="113.9766"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.1992" x="193.0352" y="135.5781">User Action: Create Tunnel</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="391.8477" x="75.2109" y="168.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="371.8477" x="85.2109" y="189.7109">Command: `gost-tunnel tcp 192.168.0.21:22 -n "SSH Access"`</text><rect fill="none" height="190.8867" style="stroke:#000000;stroke-width:1.5;" width="199.4102" x="171.4297" y="212.2422"/><path d="M250.4453,212.2422 L250.4453,221.7305 L240.4453,231.7305 L171.4297,231.7305" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.0156" x="174.4297" y="226.7773">CLI Action</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179.4102" x="181.4297" y="248.7305"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.4102" x="191.4297" y="270.332">Connects to GOST+ Service</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.4238" x="212.4229" y="302.8633"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97.4238" x="222.4229" y="324.4648">Registers Tunnel</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.4238" x="183.9229" y="356.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.4238" x="193.9229" y="378.5977">Receives Unique Tunnel ID</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="156.998" x="192.6357" y="423.1289"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.8965" x="202.6357" y="444.7305">User obtains</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.3047" x="279.3291" y="444.7305">Tunnel ID</text><rect fill="none" height="445.9063" style="stroke:#000000;stroke-width:1.5;" width="520.2695" x="11" y="479.2617"/><path d="M414.3262,479.2617 L414.3262,488.75 L404.3262,498.75 L11,498.75" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="393.3262" x="14" y="493.7969">Part 2: Bind the tunnel to a local TCP Entrypoint on Host B</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.2383" x="159.5156" y="515.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.2383" x="169.5156" y="537.3516">User Action: Create new Entrypoint</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="500.2695" x="21" y="569.8828"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="480.2695" x="31" y="591.4844">Command: `gost-tunnel bind &lt;tunnel-ID&gt; -tcp 127.0.0.1:2222 -n "SSH Access"`</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.3379" x="144.4658" y="624.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.3379" x="154.4658" y="645.6172">User Action: Or start existing Entrypoint</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="297.8398" x="122.2148" y="678.1484"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277.8398" x="132.2148" y="699.75">Command: `gost-tunnel start -n "SSH Access"`</text><rect fill="none" height="136.7539" style="stroke:#000000;stroke-width:1.5;" width="240.9121" x="150.6787" y="722.2813"/><path d="M229.6943,722.2813 L229.6943,731.7695 L219.6943,741.7695 L150.6787,741.7695" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.0156" x="153.6787" y="736.8164">CLI Action</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="220.9121" x="160.6787" y="758.7695"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.9121" x="170.6787" y="780.3711">Starts local TCP server on `:2222`</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.4414" x="183.9141" y="812.9023"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.4414" x="193.9141" y="834.5039">Links to the remote tunnel</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="317.8555" x="112.207" y="879.0352"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="297.8555" x="122.207" y="900.6367">Result: Local port `:2222` is ready for connections</text><rect fill="none" height="405.9063" style="stroke:#000000;stroke-width:1.5;" width="375.2158" x="83.5269" y="935.6211"/><path d="M448.7427,935.6211 L448.7427,945.1094 L438.7427,955.1094 L83.5269,955.1094" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="355.2158" x="86.5269" y="950.1563">Part 3: Access to the tunneled TCP service on Host B</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.8398" x="137.2148" y="972.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.5527" x="147.2148" y="993.7109">User connects to the local entrypoint</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.8398" x="147.2148" y="1007.8438">(Example: `ssh user@127.0.0.1 -p 2222`)</text><rect fill="none" height="245.0195" style="stroke:#000000;stroke-width:1.5;" width="197.9453" x="172.1621" y="1030.375"/><path d="M261.3564,1030.375 L261.3564,1039.8633 L251.3564,1049.8633 L172.1621,1049.8633" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.1943" x="175.1621" y="1044.9102">Traffic Flow</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="87.6699" x="227.2998" y="1066.8633"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="67.6699" x="237.2998" y="1088.4648">Local Client</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.7012" x="195.2842" y="1120.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.7012" x="205.2842" y="1142.5977">Local Entrypoint :2222</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.9453" x="182.1621" y="1175.1289"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.9453" x="192.1621" y="1196.7305">GOST+ Network via Tunnel</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="131.1582" x="205.5557" y="1229.2617"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.1582" x="215.5557" y="1250.8633">Remote Service :22</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.8027" x="136.2334" y="1295.3945"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.8027" x="146.2334" y="1316.9961">Outcome: Secure connection is established</text><ellipse cx="271.1348" cy="1371.5273" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="264.9476" x2="277.3219" y1="1365.3402" y2="1377.7145"/><line style="stroke:#222222;stroke-width:2.5;" x1="277.3219" x2="264.9476" y1="1365.3402" y2="1377.7145"/><line style="stroke:#181818;stroke-width:1;" x1="271.1348" x2="271.1348" y1="148.1094" y2="168.1094"/><polygon fill